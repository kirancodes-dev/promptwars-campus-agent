# Continuous integration: tests, coverage, lint and build on every push/PR to main.
# No credentials are used and nothing is deployed. Gemini and Firestore are mocked in tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      FIRESTORE_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Static check (pyflakes)
        run: python -m pyflakes $(ls agent/*.py agent/planning/*.py api/*.py services/*.py tools/*.py models/*.py main.py | grep -v test_)
      - name: Tests with branch coverage
        run: python -m coverage run --branch --source=. --omit="*/test_*.py" -m unittest discover -s . -p "test_*.py"
      - name: Coverage report
        if: always()
        run: |
          python -m coverage report --sort=cover | tee coverage.txt
          python -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.txt
            backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend tests + lint + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests with coverage
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
